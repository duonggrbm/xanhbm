<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xì Dách Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Trò chơi Xì Dách</h1>
  <div id="game">
    <div class="section">
      <h2>Bài của bạn</h2>
      <div id="player-cards" class="cards"></div>
      <p id="player-score">Điểm: 0</p>
      <button onclick="hit()">Rút bài</button>
      <button onclick="stand()">Dừng</button>
    </div>

    <div class="section">
      <h2>Bài của cái</h2>
      <div id="dealer-cards" class="cards"></div>
      <p id="dealer-score">Điểm: 0</p>
    </div>

    <p id="result"></p>
    <button onclick="restart()">Chơi lại</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
